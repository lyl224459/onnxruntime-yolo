name: NeonSight YOLO Lite Release

on:
  push:
    tags:
      - "yolo-lite-v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "发布 GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "手动发布使用的 tag，例如 yolo-lite-v1.27.0-4；留空则只上传 artifact"
        required: false
        default: ""
        type: string
      cuda_architectures:
        description: "CUDA 架构列表"
        required: true
        default: "86;89;120"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ORT_YOLO_DEFAULT_CMAKE_GENERATOR: Ninja
  ORT_YOLO_DEFAULT_CUDA_ARCHITECTURES: "86;89;120"
  ORT_YOLO_DEFAULT_CUDA_VERSION: "13.0.2"
  ORT_YOLO_DEFAULT_CUDNN_VERSION: "9.17.0"

concurrency:
  group: neonsight-yolo-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cpu-windows:
    name: Windows CPU install-root
    needs: build-cuda-windows
    if: ${{ always() && needs.build-cuda-windows.outputs.cuda_success != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/ci_build/github/windows/python/requirements.txt

      - name: Restore CMake dependency mirror cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\ort-cmake-deps-mirror
          key: ort-cmake-deps-${{ runner.os }}-${{ hashFiles('cmake/deps.txt') }}
          restore-keys: |
            ort-cmake-deps-${{ runner.os }}-

      - name: Install build Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\tools\ci_build\github\windows\python\requirements.txt

      - name: Prepare CMake dependency mirror
        continue-on-error: true
        shell: pwsh
        run: |
          $mirrorDir = Join-Path $env:RUNNER_TEMP "ort-cmake-deps-mirror"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\prepare_cmake_deps_mirror.ps1 `
            -MirrorRoot $mirrorDir `
            -DepsFile .\cmake\deps.txt `
            -IncludeNames @(
              "abseil_cpp",
              "date",
              "eigen",
              "flatbuffers",
              "googletest",
              "json",
              "microsoft_gsl",
              "microsoft_wil",
              "mp11",
              "onnx",
              "protobuf",
              "pytorch_cpuinfo",
              "re2",
              "safeint"
            )

      - name: Build CPU shared library
        id: cpu_build
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "ort-build-cpu"
          $preferredGenerator = "${{ vars.ORT_YOLO_CMAKE_GENERATOR }}"
          if ([string]::IsNullOrWhiteSpace($preferredGenerator)) {
            $preferredGenerator = $env:ORT_YOLO_DEFAULT_CMAKE_GENERATOR
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\build_cpu_yolo_lite_ci.ps1 `
            -BuildRoot $buildDir `
            -PreferredGenerator $preferredGenerator

      - name: Print CPU CMake diagnostics
        if: ${{ always() && steps.cpu_build.outcome != 'success' }}
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "ort-build-cpu"
          $candidateBuildDirs = @(
            "$buildRoot-ninja",
            "$buildRoot-vs",
            $buildRoot
          )
          foreach ($buildDir in $candidateBuildDirs) {
            if (-not (Test-Path -LiteralPath $buildDir -PathType Container)) {
              continue
            }
            Write-Host "检查 CPU 构建诊断目录: $buildDir"
            $diagnosticFiles = @(
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeFiles", "CMakeError.log")),
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeFiles", "CMakeOutput.log")),
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeCache.txt")),
              ([System.IO.Path]::Combine($buildDir, "CMakeFiles", "CMakeError.log")),
              ([System.IO.Path]::Combine($buildDir, "CMakeFiles", "CMakeOutput.log")),
              ([System.IO.Path]::Combine($buildDir, "CMakeCache.txt"))
            )
            foreach ($file in $diagnosticFiles) {
              if (Test-Path -LiteralPath $file -PathType Leaf) {
                Write-Host "===== $file ====="
                Get-Content -LiteralPath $file -Tail 220
              }
            }
          }

      - name: Package CPU install-root
        if: ${{ steps.cpu_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $buildDir = $env:ORT_YOLO_CPU_BUILD_DIR
          if ([string]::IsNullOrWhiteSpace($buildDir)) {
            $buildDir = Join-Path $env:RUNNER_TEMP "ort-build-cpu"
          }
          $artifactDir = Join-Path $env:RUNNER_TEMP "ort-artifacts"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\package_ort_install_root.ps1 `
            -BuildDir $buildDir `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -OutputDir $artifactDir `
            -PackageName "onnxruntime-yolo-lite-win-x64-cpu" `
            -PackageKind cpu
          "ORT_YOLO_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload CPU artifact
        if: ${{ steps.cpu_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: onnxruntime-yolo-lite-win-x64-cpu
          path: ${{ env.ORT_YOLO_ARTIFACT_DIR }}/*

      - name: Fail CPU job if build failed
        if: ${{ always() && steps.cpu_build.outcome != 'success' }}
        shell: pwsh
        run: |
          throw "CPU YOLO 精简版构建失败，已输出诊断日志。"

  build-cuda-windows:
    name: Windows CUDA YOLO lite install-root
    runs-on: windows-2022
    timeout-minutes: 720
    outputs:
      cuda_success: ${{ steps.cuda_result.outputs.cuda_success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/ci_build/github/windows/python/requirements.txt

      - name: Restore CUDA/cuDNN cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\ort-yolo-cuda
          key: ort-yolo-cuda-${{ runner.os }}-cuda-${{ vars.ORT_YOLO_CUDA_VERSION }}-${{ env.ORT_YOLO_DEFAULT_CUDA_VERSION }}-cudnn-${{ vars.ORT_YOLO_CUDNN_VERSION }}-${{ env.ORT_YOLO_DEFAULT_CUDNN_VERSION }}-${{ hashFiles('tools/neonsight_yolo_lite/install_cuda_cudnn_ci.ps1') }}
          restore-keys: |
            ort-yolo-cuda-${{ runner.os }}-cuda-${{ vars.ORT_YOLO_CUDA_VERSION }}-${{ env.ORT_YOLO_DEFAULT_CUDA_VERSION }}-cudnn-${{ vars.ORT_YOLO_CUDNN_VERSION }}-${{ env.ORT_YOLO_DEFAULT_CUDNN_VERSION }}-
            ort-yolo-cuda-${{ runner.os }}-

      - name: Restore CMake dependency mirror cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\ort-cmake-deps-mirror
          key: ort-cmake-deps-${{ runner.os }}-${{ hashFiles('cmake/deps.txt') }}
          restore-keys: |
            ort-cmake-deps-${{ runner.os }}-

      - name: Prepare CUDA/cuDNN environment
        id: cuda_env
        continue-on-error: true
        shell: pwsh
        env:
          ORT_YOLO_CUDA_INSTALL_COMPONENTS: ${{ vars.ORT_YOLO_CUDA_INSTALL_COMPONENTS }}
        run: |
          $cudaVersion = "${{ vars.ORT_YOLO_CUDA_VERSION }}"
          if ([string]::IsNullOrWhiteSpace($cudaVersion)) {
            $cudaVersion = $env:ORT_YOLO_DEFAULT_CUDA_VERSION
          }
          $cudnnVersion = "${{ vars.ORT_YOLO_CUDNN_VERSION }}"
          if ([string]::IsNullOrWhiteSpace($cudnnVersion)) {
            $cudnnVersion = $env:ORT_YOLO_DEFAULT_CUDNN_VERSION
          }
          $scriptArgs = @(
            "-CudaVersion", $cudaVersion,
            "-CudnnVersion", $cudnnVersion
          )
          if (-not [string]::IsNullOrWhiteSpace("${{ vars.ORT_YOLO_CUDA_INSTALLER_URL }}")) {
            $scriptArgs += @("-CudaInstallerUrl", "${{ vars.ORT_YOLO_CUDA_INSTALLER_URL }}")
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ vars.ORT_YOLO_CUDNN_MANIFEST_URL }}")) {
            $scriptArgs += @("-CudnnManifestUrl", "${{ vars.ORT_YOLO_CUDNN_MANIFEST_URL }}")
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\install_cuda_cudnn_ci.ps1 @scriptArgs

      - name: Prepare CMake dependency mirror
        if: ${{ steps.cuda_env.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $mirrorDir = Join-Path $env:RUNNER_TEMP "ort-cmake-deps-mirror"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\prepare_cmake_deps_mirror.ps1 `
            -MirrorRoot $mirrorDir `
            -DepsFile .\cmake\deps.txt `
            -IncludeNames @(
              "abseil_cpp",
              "date",
              "eigen",
              "flatbuffers",
              "googletest",
              "json",
              "microsoft_gsl",
              "microsoft_wil",
              "mp11",
              "onnx",
              "protobuf",
              "pytorch_cpuinfo",
              "re2",
              "safeint",
              "cutlass",
              "cudnn_frontend"
            )

      - name: Install build Python dependencies
        id: cuda_deps
        if: ${{ steps.cuda_env.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\tools\ci_build\github\windows\python\requirements.txt

      - name: Print CUDA build environment
        if: ${{ steps.cuda_deps.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          function Invoke-OptionalNativeCommand {
            param(
              [string]$Command,
              [string[]]$Arguments = @()
            )

            try {
              & $Command @Arguments
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "$Command $($Arguments -join ' ') 返回代码 $LASTEXITCODE"
              }
            } catch {
              Write-Warning "$Command $($Arguments -join ' ') 执行失败: $($_.Exception.Message)"
            }
          }

          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          Write-Host "CUDNN_HOME=$env:CUDNN_HOME"
          Write-Host "PATH=$env:PATH"
          Invoke-OptionalNativeCommand -Command "cmake" -Arguments @("--version")
          Invoke-OptionalNativeCommand -Command "where.exe" -Arguments @("cmake")
          Invoke-OptionalNativeCommand -Command "where.exe" -Arguments @("nvcc")
          Invoke-OptionalNativeCommand -Command "nvcc" -Arguments @("--version")
          Invoke-OptionalNativeCommand -Command "where.exe" -Arguments @("cl")

          $vsRoots = @()
          $vswhereCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"),
            (Join-Path $env:ProgramFiles "Microsoft Visual Studio\Installer\vswhere.exe")
          )
          $vswhere = $vswhereCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($vswhere) {
            $vsRoots += & $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          }
          $vsRoots += @($env:ProgramW6432, $env:ProgramFiles, ${env:ProgramFiles(x86)}) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            ForEach-Object { Join-Path $_ "Microsoft Visual Studio" } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Container } |
            ForEach-Object {
              Get-ChildItem -LiteralPath $_ -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Get-ChildItem -LiteralPath $_.FullName -Directory -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty FullName
                }
            }

          $cudaTargets = @($vsRoots | Select-Object -Unique | ForEach-Object {
            $buildCustomizationsRoot = Join-Path $_ "MSBuild\Microsoft\VC"
            if (Test-Path -LiteralPath $buildCustomizationsRoot -PathType Container) {
              Get-ChildItem -LiteralPath $buildCustomizationsRoot -Recurse -Filter "CUDA *.targets" -File -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          } | Select-Object -First 20)
          if ($cudaTargets) {
            Write-Host "Visual Studio CUDA targets:"
            $cudaTargets | ForEach-Object { Write-Host $_ }
          } else {
            Write-Warning "未找到 Visual Studio CUDA targets，CMake Visual Studio CUDA toolset 可能无法配置。"
          }

      - name: Build CUDA YOLO lite shared library
        id: cuda_build
        if: ${{ steps.cuda_deps.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "ort-build-cuda"
          $cudaArchitectures = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.cuda_architectures }}" } else { "${{ vars.ORT_YOLO_CUDA_ARCHITECTURES }}" }
          if ([string]::IsNullOrWhiteSpace($cudaArchitectures)) {
            $cudaArchitectures = $env:ORT_YOLO_DEFAULT_CUDA_ARCHITECTURES
          }
          $cudaVersion = "${{ steps.cuda_env.outputs.cuda_version }}"
          if ([string]::IsNullOrWhiteSpace($cudaVersion)) {
            $cudaVersion = "${{ vars.ORT_YOLO_CUDA_VERSION }}"
          }
          if ([string]::IsNullOrWhiteSpace($cudaVersion)) {
            $cudaVersion = $env:ORT_YOLO_DEFAULT_CUDA_VERSION
          }
          $preferredGenerator = "${{ vars.ORT_YOLO_CMAKE_GENERATOR }}"
          if ([string]::IsNullOrWhiteSpace($preferredGenerator)) {
            $preferredGenerator = $env:ORT_YOLO_DEFAULT_CMAKE_GENERATOR
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\build_cuda_yolo_lite_ci.ps1 `
            -BuildRoot $buildDir `
            -CudaArchitectures $cudaArchitectures `
            -CudaVersion $cudaVersion `
            -CudaHome $env:CUDA_PATH `
            -CudnnHome $env:CUDNN_HOME `
            -PreferredGenerator $preferredGenerator

      - name: Print CUDA CMake diagnostics
        if: ${{ always() && steps.cuda_build.outcome != 'success' }}
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "ort-build-cuda"
          $candidateBuildDirs = @(
            "$buildRoot-ninja",
            "$buildRoot-vs",
            $buildRoot
          )
          foreach ($buildDir in $candidateBuildDirs) {
            if (-not (Test-Path -LiteralPath $buildDir -PathType Container)) {
              continue
            }
            Write-Host "检查 CUDA 构建诊断目录: $buildDir"
            $diagnosticFiles = @(
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeFiles", "CMakeError.log")),
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeFiles", "CMakeOutput.log")),
              ([System.IO.Path]::Combine($buildDir, "Release", "CMakeCache.txt")),
              ([System.IO.Path]::Combine($buildDir, "CMakeFiles", "CMakeError.log")),
              ([System.IO.Path]::Combine($buildDir, "CMakeFiles", "CMakeOutput.log")),
              ([System.IO.Path]::Combine($buildDir, "CMakeCache.txt"))
            )
            foreach ($file in $diagnosticFiles) {
              if (Test-Path -LiteralPath $file -PathType Leaf) {
                Write-Host "===== $file ====="
                Get-Content -LiteralPath $file -Tail 220
              }
            }
          }

      - name: Package CUDA install-root
        id: cuda_package
        if: ${{ steps.cuda_build.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = $env:ORT_YOLO_CUDA_BUILD_DIR
          if ([string]::IsNullOrWhiteSpace($buildDir)) {
            $buildDir = Join-Path $env:RUNNER_TEMP "ort-build-cuda"
          }
          $artifactDir = Join-Path $env:RUNNER_TEMP "ort-artifacts"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\neonsight_yolo_lite\package_ort_install_root.ps1 `
            -BuildDir $buildDir `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -OutputDir $artifactDir `
            -PackageName "onnxruntime-yolo-lite-win-x64-cuda" `
            -PackageKind cuda
          "ORT_YOLO_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload CUDA artifact
        id: cuda_upload
        if: ${{ steps.cuda_package.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: onnxruntime-yolo-lite-win-x64-cuda
          path: ${{ env.ORT_YOLO_ARTIFACT_DIR }}/*

      - name: Set CUDA fallback result
        id: cuda_result
        if: ${{ always() }}
        shell: pwsh
        run: |
          $outcomes = @(
            "${{ steps.cuda_env.outcome }}",
            "${{ steps.cuda_deps.outcome }}",
            "${{ steps.cuda_build.outcome }}",
            "${{ steps.cuda_package.outcome }}",
            "${{ steps.cuda_upload.outcome }}"
          )
          $success = -not ($outcomes | Where-Object { $_ -ne "success" })
          "cuda_success=$($success.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($success) {
            Write-Host "CUDA YOLO 精简版构建成功。"
          } else {
            Write-Warning "CUDA YOLO 精简版未完成，将继续执行 CPU 兜底构建。步骤状态: $($outcomes -join ', ')"
          }

  release:
    name: Publish GitHub Release
    needs: [build-cpu-windows, build-cuda-windows]
    if: ${{ always() && (needs.build-cuda-windows.outputs.cuda_success == 'true' || needs.build-cpu-windows.result == 'success') && (startsWith(github.ref, 'refs/tags/yolo-lite-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create release notes
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.release_tag }}"
          fi
          {
            echo "# NeonSight YOLO Lite ONNX Runtime"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Tag: ${tag_name}"
            if [ "${{ needs.build-cuda-windows.outputs.cuda_success }}" = "true" ]; then
              echo "- CUDA YOLO lite install-root: included"
              echo "- CPU install-root: not built because CUDA succeeded"
            elif [ "${{ needs.build-cpu-windows.result }}" = "success" ]; then
              echo "- CUDA YOLO lite install-root: failed or unavailable"
              echo "- CPU install-root: included as fallback"
            else
              echo "- No install-root artifact was produced"
            fi
            echo
            echo "Assets contain an include/lib/bin install-root layout and BUILD_INFO.json."
          } > RELEASE_NOTES.md
          echo "ORT_YOLO_RELEASE_TAG=${tag_name}" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          assets=(release-assets/**/*.zip release-assets/**/*.md)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          if gh release view "${ORT_YOLO_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${ORT_YOLO_RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${ORT_YOLO_RELEASE_TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "NeonSight YOLO Lite ORT ${ORT_YOLO_RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
